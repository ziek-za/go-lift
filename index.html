<!DOCTYPE html>
<html lang="en-ZA">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#131519">
<title>Load</title>
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" href="./icon-192.png">
<link rel="apple-touch-icon" href="./icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="./styles.css">
</head>
<body>

<header>
  <h1>Load</h1>
  <span class="hright">
    <span class="sessionclock mono" id="sessionclock" aria-live="off"></span>
    <span class="cycle mono" id="cycle"></span>
  </span>
</header>

<main>
  <section class="view on" id="v-today"></section>
  <section class="view" id="v-plan"></section>
  <section class="view" id="v-progress"></section>
  <section class="view" id="v-data"></section>
</main>

<nav aria-label="Sections">
  <button data-v="today" aria-current="page">
    <svg viewBox="0 0 24 24"><path d="M4 12h3l2-6 3 12 3-9 2 3h3"/></svg>Today</button>
  <button data-v="plan" aria-current="false">
    <svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="17" rx="2"/><path d="M3 9h18M8 3v3M16 3v3"/></svg>Plan</button>
  <button data-v="progress" aria-current="false">
    <svg viewBox="0 0 24 24"><path d="M4 19V5M4 19h16M7 15l4-5 3 3 5-7"/></svg>Progress</button>
  <button data-v="data" aria-current="false">
    <svg viewBox="0 0 24 24"><path d="M12 3v12M8 11l4 4 4-4M4 17v2a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-2"/></svg>Data</button>
</nav>

<div id="pop" class="pop" aria-hidden="true"></div>
<div id="sheet" role="dialog" aria-modal="true"></div>
<div id="timerbar" role="timer" aria-live="off"></div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script type="module" src="./app.js"></script>
</body>
</html>
